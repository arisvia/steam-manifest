[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-manifest"
version = "4.0.2"
description = "Steam manifest parser and downloader"
readme = "README.md"
license = "MIT"
keywords = ["steam", "manifest", "downloader", "parser", "vdf", "depot"]
authors = [
    { name = "arisvia", email = "160387885+arisvia@users.noreply.github.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "aiofiles",
    "aiohttp[speedups]",
    "cachetools",
    "vdf",
    "loguru",
    "rich",
    "orjson",
    "tenacity",
    "mypy",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "types-aiofiles",
    "types-cachetools",
]

[project.scripts]
steam-manifest = "steam_manifest.cli:main"

[project.urls]
Homepage = "https://github.com/arisvia/steam-manifest"
Repository = "https://github.com/arisvia/steam-manifest"
Issues = "https://github.com/arisvia/steam-manifest/issues"

[tool.setuptools]
packages = ["steam_manifest", "steam_manifest.core"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
steam_manifest = ["assets/*.ico", "py.typed"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=steam_manifest --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
